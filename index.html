</head>
<body>
<H1> Phan Huỳnh Mỹ Hảo </H1>
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Chấm Điểm Phát Âm Tiếng Trung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .word-box {
            background-color: #f8f9fa;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .chinese-text {
            font-size: 42px;
            font-weight: bold;
            color: #1e293b;
            margin: 0;
            letter-spacing: 4px;
        }
        .pinyin {
            font-size: 18px;
            color: #64748b;
            margin: 5px 0 0 0;
        }
        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }
        .btn:hover {
            background-color: #059669;
        }
        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        .btn.recording {
            background-color: #ef4444;
            animation: pulse 1.5s infinite;
        }
        .result-section {
            margin-top: 25px;
            display: none;
        }
        .score {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .good { color: #10b981; }
        .average { color: #f59e0b; }
        .bad { color: #ef4444; }
        
        .details-box {
            font-size: 16px;
            color: #475569;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: left;
            line-height: 1.6;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chấm Điểm Tiếng Trung</h1>
    
    <div class="word-box">
        <p class="chinese-text" id="target-cn">我想学汉语</p>
        <p class="pinyin" id="target-pinyin">w\u01d2 xi\u0103ng xu\u00e9 H\u00e0ny\u01d4</p>
    </div>

    <button class="btn" id="record-btn">Nhấn để nói</button>

    <div class="result-section" id="result-section">
        <div class="score" id="score-display">0%</div>
        
        <div class="details-box">
            • Từ mẫu: <strong id="show-target">...</strong> (Có <span id="target-len">0</span> chữ)<br>
            • Bạn đọc: <strong id="user-transcript" style="color: #3b82f6;">...</strong><br>
            • Kết quả: <span id="match-stats" style="font-weight: bold; color: #1e293b;">Đúng 0 / Sai 0</span>
        </div>
        
        <p id="feedback-msg" style="font-weight: 600; margin-top: 15px;"></p>
        
        <button class="btn" id="next-btn" style="background-color: #3b82f6; margin-top: 15px;">Đổi câu ngẫu nhiên</button>
    </div>
</div>

<script>
    // Danh sách câu mẫu dài một chút để dễ chấm đúng/sai từng chữ
    const wordList = [
        { cn: "我想学汉语", pinyin: "wǒ xiǎng xué Hànyǔ" },
        { cn: "今天天气很好", pinyin: "jīntiān tiānqì hěn hǎo" },
        { cn: "你是哪国人", pinyin: "nǐ shì nǎ guó rén" },
        { cn: "很高兴认识你", pinyin: "hěn gāoxìng rènshi nǐ" },
        { cn: "我想吃中国菜", pinyin: "wǒ xiǎng chī Zhōngguócài" },
        { cn: "你会說英语吗", pinyin: "nǐ huì shuō Yīngyǔ ma" },
        { cn: "请问洗手间在哪", pinyin: "qǐngwèn xǐshǒujiān zài nǎ" }
    ];

    let currentWord = wordList[0];
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ nhận dạng giọng nói. Hãy dùng Google Chrome!");
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const recordBtn = document.getElementById('record-btn');
    const nextBtn = document.getElementById('next-btn');
    const targetCnDisplay = document.getElementById('target-cn');
    const targetPinyinDisplay = document.getElementById('target-pinyin');
    const resultSection = document.getElementById('result-section');
    const userTranscript = document.getElementById('user-transcript');
    const scoreDisplay = document.getElementById('score-display');
    const feedbackMsg = document.getElementById('feedback-msg');
    const showTarget = document.getElementById('show-target');
    const targetLen = document.getElementById('target-len');
    const matchStats = document.getElementById('match-stats');

    let isRecording = false;

    recordBtn.addEventListener('click', () => {
        if (!isRecording) recognition.start();
        else recognition.stop();
    });

    recognition.onstart = () => {
        isRecording = true;
        recordBtn.textContent = "Đang lắng nghe... Hãy nói đi!";
        recordBtn.classList.add('recording');
        resultSection.style.display = 'none';
    };

    recognition.onend = () => {
        isRecording = false;
        recordBtn.textContent = "Nhấn để nói";
        recordBtn.classList.remove('recording');
    };

    recognition.onresult = (event) => {
        const resultText = event.results[0][0].transcript;
        
        // Làm sạch loại bỏ dấu câu
        const cleanResult = resultText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");
        const cleanTarget = currentWord.cn.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");

        // Đếm số chữ trùng khớp chính xác
        let correctCount = 0;
        let targetChars = cleanTarget.split('');
        let resultChars = cleanResult.split('');

        // Thuật toán đếm số ký tự khớp
        targetChars.forEach(char => {
            const index = resultChars.indexOf(char);
            if (index !== -1) {
                correctCount++;
                resultChars.splice(index, 1); // Xóa ký tự đã khớp để tránh đếm trùng
            }
        });

        let totalTarget = targetChars.length;
        let wrongCount = totalTarget - correctCount;
        
        // Tính % điểm thực tế dựa trên số chữ đúng
        let score = Math.round((correctCount / totalTarget) * 100);

        // Hiển thị lên giao diện
        showTarget.textContent = currentWord.cn;
        targetLen.textContent = totalTarget;
        userTranscript.textContent = resultText;
        matchStats.textContent = `Đúng ${correctCount} / Sai ${wrongCount} chữ`;
        
        displayResult(score);
    };

    recognition.onerror = (event) => {
        alert("Lỗi nhận diện hoặc chưa nói gì: " + event.error);
    };

    function displayResult(score) {
        resultSection.style.display = 'block';
        scoreDisplay.textContent = score + "%";
        scoreDisplay.className = "score";
        
        if (score >= 85) {
            scoreDisplay.classList.add('good');
            feedbackMsg.textContent = "Xuất sắc! Phát âm rất chuẩn xác.";
            feedbackMsg.className = "good";
        } else if (score >= 50) {
            scoreDisplay.classList.add('average');
            feedbackMsg.textContent = "Tạm được! Bạn bị sai một vài chữ, hãy thử lại nhé.";
            feedbackMsg.className = "average";
        } else {
            scoreDisplay.classList.add('bad');
            feedbackMsg.textContent = "Sai hơi nhiều rồi! Cố gắng đọc rõ ràng từng chữ nha.";
            feedbackMsg.className = "bad";
        }
    }

    nextBtn.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * wordList.length);
        currentWord = wordList[randomIndex];
        targetCnDisplay.textContent = currentWord.cn;
        targetPinyinDisplay.textContent = currentWord.pinyin;
        resultSection.style.display = 'none';
    });
</script>

</body>
</html>
