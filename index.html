<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Học Từ Đơn Tiếng Trung</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .word-box {
            background: linear-gradient(135deg, #fdfbf7 0%, #f5f7fa 100%);
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 25px;
        }
        .chinese-text {
            font-size: 56px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
            letter-spacing: 2px;
        }
        .pinyin {
            font-size: 20px;
            color: #e67e22;
            font-weight: 500;
            margin: 8px 0 2px 0;
        }
        .meaning {
            font-size: 15px;
            color: #7f8c8d;
            font-style: italic;
            margin: 0;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }
        .btn:hover {
            background-color: #27ae60;
            transform: translateY(-1px);
        }
        .btn.recording {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }
        .result-section {
            margin-top: 25px;
            display: none;
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
        }
        
        /* Thanh hiển thị phần trăm Đúng/Sai */
        .progress-container {
            display: flex;
            height: 24px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #edf2f7;
            margin: 15px 0;
            font-weight: bold;
            font-size: 12px;
            color: white;
            line-height: 24px;
        }
        .progress-correct {
            background-color: #2ecc71;
            transition: width 0.5s ease;
        }
        .progress-wrong {
            background-color: #e74c3c;
            transition: width 0.5s ease;
        }

        .details-box {
            font-size: 15px;
            color: #4a5568;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        .feedback {
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Luyện Từ Đơn Tiếng Trung</h1>
    <p class="subtitle">Chấm điểm chính xác theo từng chữ</p>
    
    <div class="word-box">
        <p class="chinese-text" id="target-cn">苹果</p>
        <p class="pinyin" id="target-pinyin">píngguǒ</p>
        <p class="meaning" id="target-meaning">(Quả táo)</p>
    </div>

    <button class="btn" id="record-btn">Nhấn để đọc từ này</button>

    <div class="result-section" id="result-section">
        <div class="progress-container">
            <div class="progress-correct" id="bar-correct" style="width: 0%;">Đúng: 0%</div>
            <div class="progress-wrong" id="bar-wrong" style="width: 0%;">Sai: 0%</div>
        </div>

        <div class="details-box">
            • Bạn vừa đọc: <strong id="user-transcript" style="color: #3498db;">...</strong><br>
            • Kết quả chi tiết: <span id="match-stats" style="font-weight: bold;">Đúng 0 / Sai 0 chữ</span>
        </div>
        
        <p class="feedback" id="feedback-msg"></p>
        
        <button class="btn" id="next-btn" style="background-color: #3498db; margin-top: 15px; box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);">Từ đơn tiếp theo</button>
    </div>
</div>

<script>
    // Danh sách các từ đơn (từ ghép 2-3 chữ phổ biến) kèm nghĩa tiếng Việt
    const wordList = [
        { cn: "苹果", pinyin: "píngguǒ", meaning: "Quả táo" },
        { cn: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
        { cn: "咖啡", pinyin: "kāfēi", meaning: "Cà phê" },
        { cn: "学生", pinyin: "xuéshēng", meaning: "Học sinh" },
        { cn: "老师", pinyin: "lǎoshī", meaning: "Giáo viên" },
        { cn: "猫咪", pinyin: "māomī", meaning: "Con mèo" },
        { cn: "电脑", pinyin: "diànnǎo", meaning: "Máy tính" },
        { cn: "手机", pinyin: "shǒujī", meaning: "Điện thoại" },
        { cn: "跑步", pinyin: "pǎobù", meaning: "Chạy bộ" },
        { cn: "喝水", pinyin: "hē shuǐ", meaning: "Uống nước" },
        { cn: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
        { cn: "喜欢", pinyin: "xǐhuan", meaning: "Thích" },
        { cn: "飞机", pinyin: "fēijī", meaning: "Máy bay" },
        { cn: "中国", pinyin: "Zhōngguó", meaning: "Trung Quốc" }
    ];

    let currentWord = wordList[0];
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ nhận dạng giọng nói. Hãy dùng Google Chrome!");
    }

    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN'; 
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const recordBtn = document.getElementById('record-btn');
    const nextBtn = document.getElementById('next-btn');
    const targetCnDisplay = document.getElementById('target-cn');
    const targetPinyinDisplay = document.getElementById('target-pinyin');
    const targetMeaningDisplay = document.getElementById('target-meaning');
    const resultSection = document.getElementById('result-section');
    const userTranscript = document.getElementById('user-transcript');
    const barCorrect = document.getElementById('bar-correct');
    const barWrong = document.getElementById('bar-wrong');
    const feedbackMsg = document.getElementById('feedback-msg');
    const matchStats = document.getElementById('match-stats');

    let isRecording = false;

    recordBtn.addEventListener('click', () => {
        if (!isRecording) recognition.start();
        else recognition.stop();
    });

    recognition.onstart = () => {
        isRecording = true;
        recordBtn.textContent = "Đang lắng nghe... Hãy nói đi!";
        recordBtn.classList.add('recording');
        resultSection.style.display = 'none';
    };

    recognition.onend = () => {
        isRecording = false;
        recordBtn.textContent = "Nhấn để đọc từ này";
        recordBtn.classList.remove('recording');
    };

    recognition.onresult = (event) => {
        const resultText = event.results[0][0].transcript;
        
        // Làm sạch loại bỏ dấu câu phát sinh
        const cleanResult = resultText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");
        const cleanTarget = currentWord.cn.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");

        // Đếm số chữ trùng khớp chính xác từng chữ một
        let correctCount = 0;
        let targetChars = cleanTarget.split('');
        let resultChars = cleanResult.split('');

        targetChars.forEach(char => {
            const index = resultChars.indexOf(char);
            if (index !== -1) {
                correctCount++;
                resultChars.splice(index, 1); 
            }
        });

        let totalTarget = targetChars.length;
        let wrongCount = totalTarget - correctCount;
        
        // Tính tỷ lệ phần trăm Đúng và Sai rõ ràng
        let correctPercent = Math.round((correctCount / totalTarget) * 100);
        let wrongPercent = 100 - correctPercent;

        // Cập nhật giao diện thanh tiến trình (Progress Bar)
        barCorrect.style.width = correctPercent + "%";
        barCorrect.textContent = correctPercent > 0 ? `Đúng: ${correctPercent}%` : "";
        
        barWrong.style.width = wrongPercent + "%";
        barWrong.textContent = wrongPercent > 0 ? `Sai: ${wrongPercent}%` : "";

        // Hiển thị chữ người dùng đã đọc và số lượng chi tiết
        userTranscript.textContent = resultText ? resultText : "(Không rõ từ gì)";
        matchStats.textContent = `Đúng ${correctCount} / Sai ${wrongCount} chữ`;
        
        // Đưa ra lời khuyên đánh giá
        if (correctPercent === 100) {
            feedbackMsg.textContent = "🎉 Tuyệt hảo! Đúng 100%.";
            feedbackMsg.style.color = "#2ecc71";
        } else if (correctPercent >= 50) {
            feedbackMsg.textContent = "👍 Khá tốt! Bạn bị phát âm lệch mất vài chữ.";
            feedbackMsg.style.color = "#e67e22";
        } else {
            feedbackMsg.textContent = "❌ Sai rồi! Hãy nhìn kỹ phiên âm pinyin và đọc lại nhé.";
            feedbackMsg.style.color = "#e74c3c";
        }

        resultSection.style.display = 'block';
    };

    recognition.onerror = (event) => {
        alert("Lỗi hoặc chưa nhận diện được âm thanh. Xin vui lòng thử lại!");
    };

    // Đổi sang từ đơn ngẫu nhiên mới
    nextBtn.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * wordList.length);
        currentWord = wordList[randomIndex];
        targetCnDisplay.textContent = currentWord.cn;
        targetPinyinDisplay.textContent = currentWord.pinyin;
        targetMeaningDisplay.textContent = `(${currentWord.meaning})`;
        resultSection.style.display = 'none';
    });
</script>

</body>
</html>
